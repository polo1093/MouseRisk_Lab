<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Schema personal_arc_click</title>
  <desc id="desc">La souris part de sa position actuelle, suit un grand arc, depasse un point fantome choisi dans la zone, puis revient par une correction courte pour cliquer precisement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.55" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1D4ED8" flood-opacity="0.18"/>
    </filter>
    <filter id="labelShadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.5" flood-color="#BE123C" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="744" height="404" rx="18" fill="url(#bg)" stroke="#93C5FD"/>
  <rect x="8" y="8" width="744" height="404" rx="18" fill="url(#grid)" opacity="0.65"/>

  <text x="380" y="55" text-anchor="middle" fill="#F43F5E" stroke="#BE123C" stroke-width="1.8" paint-order="stroke" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="900" filter="url(#labelShadow)">
    Position souris au depart
  </text>

  <g filter="url(#softShadow)">
    <circle cx="205" cy="132" r="25" fill="#FFFFFF" stroke="#2563EB" stroke-width="8"/>
    <circle cx="205" cy="132" r="13" fill="#FFFFFF" stroke="#EF4444" stroke-width="7"/>
    <circle cx="205" cy="132" r="4" fill="#EF4444"/>
  </g>

  <rect x="238" y="205" width="210" height="120" rx="4" fill="rgba(219,234,254,0.42)" stroke="#F43F5E" stroke-width="4"/>
  <text x="343" y="197" text-anchor="middle" fill="#BE123C" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="900">zone indiquee</text>

  <circle cx="334" cy="268" r="12" fill="#FFFFFF" fill-opacity="0.7" stroke="#16A34A" stroke-width="4" stroke-dasharray="5 5"/>
  <circle cx="334" cy="268" r="3.5" fill="#16A34A"/>
  <text x="281" y="251" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="900">point fantome</text>

  <circle cx="402" cy="290" r="7" fill="#F43F5E"/>
  <text x="402" y="309" text-anchor="middle" fill="#BE123C" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">depassement</text>

  <path d="M 60 74 C 36 170 82 252 172 291 C 242 322 327 311 402 290" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>
  <path d="M 402 290 L 334 268" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>

  <path d="M 391 288 L 402 290 L 394 282" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 345 270 L 334 268 L 342 276" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">
    <text x="84" y="340" fill="#334155">1. grand arc rapide</text>
    <text x="84" y="364" fill="#334155">2. on depasse la cible</text>
    <text x="84" y="388" fill="#334155">3. retour court, pause, clic</text>
  </g>
</svg>
