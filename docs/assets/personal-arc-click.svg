<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Schema personal_arc_click</title>
  <desc id="desc">La souris part de sa position actuelle, suit un grand arc, depasse la cible, puis revient par un second arc pour cliquer precisement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.55" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1D4ED8" flood-opacity="0.18"/>
    </filter>
    <filter id="labelShadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.5" flood-color="#BE123C" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="744" height="404" rx="18" fill="url(#bg)" stroke="#93C5FD"/>
  <rect x="8" y="8" width="744" height="404" rx="18" fill="url(#grid)" opacity="0.65"/>

  <text x="380" y="55" text-anchor="middle" fill="#F43F5E" stroke="#BE123C" stroke-width="1.8" paint-order="stroke" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="900" filter="url(#labelShadow)">
    Position souris au depart
  </text>

  <g filter="url(#softShadow)">
    <circle cx="205" cy="132" r="25" fill="#FFFFFF" stroke="#2563EB" stroke-width="8"/>
    <circle cx="205" cy="132" r="13" fill="#FFFFFF" stroke="#EF4444" stroke-width="7"/>
    <circle cx="205" cy="132" r="4" fill="#EF4444"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="612" cy="226" r="25" fill="#FFFFFF" stroke="#2563EB" stroke-width="8"/>
    <circle cx="612" cy="226" r="13" fill="#FFFFFF" stroke="#EF4444" stroke-width="7"/>
    <circle cx="612" cy="226" r="4" fill="#EF4444"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="485" cy="362" r="25" fill="#FFFFFF" stroke="#2563EB" stroke-width="8"/>
    <circle cx="485" cy="362" r="13" fill="#FFFFFF" stroke="#EF4444" stroke-width="7"/>
    <circle cx="485" cy="362" r="4" fill="#EF4444"/>
  </g>

  <rect x="240" y="205" width="170" height="115" rx="4" fill="rgba(219,234,254,0.42)" stroke="#F43F5E" stroke-width="4"/>
  <circle cx="455" cy="286" r="7" fill="#F43F5E"/>
  <text x="455" y="270" text-anchor="middle" fill="#BE123C" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">depassement</text>

  <path d="M 60 74 C 38 166 88 247 170 286 C 242 320 336 301 455 286" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>
  <path d="M 455 286 C 468 258 463 235 448 218 C 437 206 425 201 410 205" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"/>

  <path d="M 444 287 L 455 286 L 447 279" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 419 205 L 410 205 L 415 214" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="410" cy="205" r="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/>
  <text x="418" y="190" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="900">point precis clique</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">
    <text x="84" y="340" fill="#334155">1. grand arc rapide</text>
    <text x="84" y="364" fill="#334155">2. on depasse la cible</text>
    <text x="84" y="388" fill="#334155">3. retour court, pause, clic</text>
  </g>
</svg>
